name: Build unsigned IPA

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build for device
        run: |
          xcodebuild -project Cydia.xcodeproj -target Cydia -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP=build/Release-iphoneos/Cydia.app
          echo "APP=$APP"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r -q Cydia-unsigned.ipa Payload
          ls -la Cydia-unsigned.ipa

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" Cydia-unsigned.ipa --title "$GITHUB_REF_NAME" --notes "Unsigned IPA for sideloading (LCSign). Visual Cydia clone, non-functional."
